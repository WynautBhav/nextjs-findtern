# findtern.in → new app (port 3001). Install as sites-available/findtern.in.next.
# Rollback: re-link the untouched legacy file (sites-available/findtern.in.legacy)
# and reload. Don't just point proxy_pass at 5000: legacy also needs its
# static root and /uploads alias (docs/launch-2026-10-28.md, step R).
# TLS lines: uncomment; the paths match the certbot-managed live certificate.
server {
    listen 443 ssl http2;
    server_name findtern.in www.findtern.in;

    # ssl_certificate     /etc/letsencrypt/live/findtern.in/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/findtern.in/privkey.pem;

    client_max_body_size 60m;          # intro videos up to 50 MB

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Overwrite, don't append: rate limits trust the first value.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;           # pages stream
        proxy_read_timeout 60s;
    }

    location /api/uploads {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_request_buffering off;
    }
}

server {
    listen 80;
    server_name findtern.in www.findtern.in;
    return 301 https://findtern.in$request_uri;
}
